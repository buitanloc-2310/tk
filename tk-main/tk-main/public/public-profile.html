<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ thành viên · Sky First Network</title><link rel="icon" href="/sfn-logo.png"><link rel="stylesheet" href="/styles.css"></head><body class="public-profile-page"><main id="profilePublic" class="public-profile-wrap"><div class="public-profile-loading">Đang mở hồ sơ Sky First…</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');const root=document.querySelector('#profilePublic');try{const r=await fetch('/api/public/member-profile?slug='+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw 0;const p=d.profile;const list=(title,a,fn)=>a?.length?`<section class="public-profile-section"><h2>${title}</h2>${a.map(fn).join('')}</section>`:'';root.classList.add('theme-'+(p.theme||'sky'));root.innerHTML=`<header class="public-profile-hero"><div class="public-profile-brand"><img src="/sfn-logo.png"><span>SKY FIRST NETWORK · MEMBER IDENTITY</span></div><div class="public-profile-person">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:`<div class="public-avatar-fallback">SF</div>`}<div><div class="public-verified">✓ HỒ SƠ THÀNH VIÊN</div><h1>${esc(p.full_name)}</h1><p>${esc(p.headline||'Thành viên Sky First Network')}</p><small>${esc(p.member_code||'')}</small></div></div></header><div class="public-profile-body">${p.bio?`<section class="public-profile-section"><h2>Giới thiệu</h2><p>${esc(p.bio)}</p></section>`:''}${(p.email||p.phone)?`<section class="public-profile-section"><h2>Liên hệ công khai</h2><p>${p.email?esc(p.email):''}${p.email&&p.phone?' · ':''}${p.phone?esc(p.phone):''}</p></section>`:''}${list('Hành trình tại Sky First',d.memberships,x=>`<article><b>${esc(x.title||x.role_label||'Thành viên')}</b><span>${esc(x.org_name||'SFN')} · ${esc(x.started_at||'')} → ${esc(x.ended_at||'Hiện tại')}</span></article>`)}${list('Hoạt động',d.activities,x=>`<article><b>${esc(x.name)}</b><span>${esc(x.role_label||'Thành viên')} · ${esc(x.starts_at||'')}</span></article>`)}${list('Chứng nhận',d.certificates,x=>`<article><b>${esc(x.title)}</b><span>${esc(x.issuer||'SFN')} · ${esc(x.issued_at||'')}</span></article>`)}${list('Thành tích & ghi nhận',d.achievements,x=>`<article><b>${esc(x.title)}</b><span>${esc(x.issuer||'SFN')} · ${esc(x.achieved_at||'')}</span></article>`)}</div><footer class="public-profile-foot">Hồ sơ công khai do thành viên kiểm soát quyền riêng tư · Sky First Network</footer>`}catch{root.innerHTML='<div class="public-profile-error"><img src="/sfn-logo.png"><h1>Hồ sơ không khả dụng</h1><p>Hồ sơ này chưa được xuất bản hoặc đường dẫn không tồn tại.</p><a href="/">Cổng Thành viên</a></div>'}})();
</script></body></html>
