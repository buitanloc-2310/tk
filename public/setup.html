<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thiết lập SFN Member Portal</title><link rel="stylesheet" href="/styles.css"></head><body><div class="auth-shell"><section class="auth-card"><div class="auth-brand-row"><img class="auth-logo" src="/sfn-logo.png" alt="SFN"><div><div class="brand">SFN MEMBER PORTAL</div><div class="subtitle">THIẾT LẬP HỆ THỐNG LẦN ĐẦU</div></div></div><p>Tạo tài khoản Quản trị hệ thống đầu tiên. Sau khi hoàn tất, trang này tự khóa.</p><form id="f" class="form-grid"><label>Họ và tên<input name="full_name" required></label><label>Tên đăng nhập<input name="username" required></label><label>Email<input name="email" type="email"></label><label>Mật khẩu đầu tiên<input name="password" type="password" minlength="10" required></label><button class="primary">HOÀN TẤT THIẾT LẬP</button></form><p id="m" class="msg"></p></section></div><script>f.onsubmit=async e=>{e.preventDefault();m.textContent='Đang thiết lập...';const r=await fetch('/api/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json().catch(()=>({}));if(!r.ok){m.textContent='Lỗi: '+(d.error||r.status);return}location.href='/'}</script></body></html>
