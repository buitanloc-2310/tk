<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xác minh · SFN</title><link rel="stylesheet" href="/styles.css"></head><body class="public-page"><main class="public-wrap"><div class="public-head"><img src="/sfn-logo.png?v=final-20260901" alt="SFN"><div><b>CỔNG THÀNH VIÊN SKY FIRST NETWORK</b><div class="muted">Xác minh hồ sơ điện tử</div></div></div><section class="public-card"><h1>Xác minh</h1><div id="verifyBox">Đang kiểm tra...</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const code=new URL(location.href).searchParams.get('code')||'';const box=document.querySelector('#verifyBox');if(!code){box.innerHTML='<p>Thiếu mã xác minh.</p>';return}const r=await fetch('/api/public/verify?code='+encodeURIComponent(code)),d=await r.json().catch(()=>({}));if(!r.ok){box.innerHTML='<p>Không tìm thấy hồ sơ hoặc mã không hợp lệ.</p>';return}const x=d.record;if(d.type==='card')box.innerHTML=`<p><span class="badge ${d.valid?'ok':'off'}">${d.valid?'THẺ HỢP LỆ':'THẺ KHÔNG CÒN HIỆU LỰC'}</span></p><h2>${esc(x.full_name)}</h2><p><b>Mã thành viên:</b> ${esc(x.member_code)}</p><p><b>Loại thẻ:</b> ${esc(x.card_type_name)}</p><p><b>Chức danh:</b> ${esc(x.title_on_card||'—')}</p><p><b>Đơn vị:</b> ${esc(x.org_name||'SFN')}</p><p><b>Số thẻ:</b> ${esc(x.card_number)}</p>`;else box.innerHTML=`<p><span class="badge ${d.valid?'ok':'off'}">${d.valid?'CHỨNG NHẬN ĐÃ XÁC MINH':'CHƯA XÁC MINH'}</span></p><h2>${esc(x.full_name)}</h2><p><b>Mã thành viên:</b> ${esc(x.member_code)}</p><p><b>Chứng nhận:</b> ${esc(x.title)}</p><p><b>Số GCN:</b> ${esc(x.certificate_no||'—')}</p><p><b>Đơn vị cấp:</b> ${esc(x.issuer)}</p><p><b>Ngày cấp:</b> ${esc(x.issued_at||'—')}</p>`})()</script></body></html>
